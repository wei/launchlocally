<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LaunchLocally</title>
<style>
:root{--bg:#0b0d10;--panel:#14181d;--line:#262c34;--text:#f3f5f7;--muted:#98a2ae;--accent:#ffd23f;--on:#111}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.45 "Inter","Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
main{max-width:1120px;margin:0 auto;padding:36px 24px 48px}
h1{font-size:clamp(44px,7vw,84px);line-height:1;margin:0;letter-spacing:-.03em}
h1 span{color:var(--accent)}
.tag{font-size:clamp(20px,2.6vw,30px);color:var(--muted);margin:10px 0 32px}
h2{font-size:15px;font-weight:600;color:var(--muted);margin:28px 0 10px}
.sponsors{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.sponsors button{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:22px 18px;text-align:left;cursor:pointer;font:inherit;transition:border-color .15s,transform .15s}
.sponsors button:hover,.sponsors button:focus-visible{border-color:var(--accent);transform:translateY(-2px);outline:none}
.sponsors b{display:block;font-size:26px;letter-spacing:-.01em}
.sponsors small{color:var(--muted);font-size:16px}
form{display:flex;gap:12px;flex-wrap:wrap}
input,select{flex:1 1 280px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:16px 18px;font:inherit;font-size:20px;min-width:0}
select{flex:0 1 300px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
form button{background:var(--accent);color:var(--on);border:0;border-radius:12px;padding:16px 30px;font:inherit;font-size:20px;font-weight:700;cursor:pointer}
form button:disabled{opacity:.5;cursor:wait}
#err{color:#ff7a70;min-height:1.5em;margin:10px 0 0}
#runs{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
#runs li{display:flex;gap:14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#runs a{color:var(--text);text-decoration:none}
#runs a.name{font-weight:600;flex:1 1 220px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#runs a:hover{color:var(--accent)}
#runs .m{color:var(--muted);font-size:15px}
.st{font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.st.done{color:#5ee08f;border-color:#2c6b45}.st.running{color:var(--accent);border-color:var(--accent)}.st.error{color:#ff7a70;border-color:#7a3530}
.replay{font-size:15px;border:1px solid var(--line);border-radius:8px;padding:4px 12px}
@media (max-width:760px){.sponsors{grid-template-columns:1fr 1fr}main{padding:24px 16px}}
</style>
</head>
<body>
<main>
  <h1>Launch<span>Locally</span></h1>
  <p class="tag">Paste a URL. Launch like a local.</p>

  <h2>Launch a sponsor</h2>
  <div class="sponsors" id="sponsors">
    <button data-url="https://www.daytona.io"><b>Daytona</b><small>daytona.io</small></button>
    <button data-url="https://www.tavily.com"><b>Tavily</b><small>tavily.com</small></button>
    <button data-url="https://nosana.com"><b>Nosana</b><small>nosana.com</small></button>
    <button data-url="https://agentfield.ai"><b>AgentField</b><small>agentfield.ai</small></button>
  </div>

  <h2>Or any product</h2>
  <form id="form">
    <input id="url" name="url" placeholder="https://your-product.com" autocomplete="off" aria-label="Product URL" required>
    <select id="market" aria-label="Target market"></select>
    <button id="go">Launch</button>
  </form>
  <p id="err" role="alert"></p>

  <h2>Past runs</h2>
  <ul id="runs"><li class="m">Loading…</li></ul>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function launch(url) {
  $('#err').textContent = '';
  $('#go').disabled = true;
  try {
    const r = await fetch('/api/launch', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url, market: $('#market').value})});
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    location.href = '/run/' + j.run_id;
  } catch (e) {
    $('#err').textContent = e.message;
    $('#go').disabled = false;
  }
}
$('#sponsors').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { $('#url').value = b.dataset.url; launch(b.dataset.url); } });
$('#form').addEventListener('submit', e => { e.preventDefault(); launch($('#url').value); });

fetch('/api/packs').then(r => r.json()).then(ps => {
  $('#market').innerHTML = ps.map(p => `<option value="${esc(p.id)}"${p.id === 'ja-JP' ? ' selected' : ''}>${esc(p.label)} (${esc(p.id)})</option>`).join('');
});
fetch('/api/runs').then(r => r.json()).then(rs => {
  $('#runs').innerHTML = rs.length ? rs.map(r => `<li>
    <a class="name" href="/run/${esc(r.run_id)}">${esc(r.product || r.url || r.run_id)}</a>
    <span class="m">${esc(r.market)}</span><span class="m">${esc(r.run_id)}</span>
    <span class="st ${esc(r.status)}">${esc(r.status)}</span>
    ${r.status === 'done' ? `<a class="replay" href="/run/${esc(r.run_id)}?replay=1&speed=4">Replay</a>` : ''}
  </li>`).join('') : '<li class="m">No runs yet.</li>';
});
</script>
</body>
</html>
